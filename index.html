<style>
  :root {
    /* Palette inspired by traumahealing.org */
    --bg: #F7F3F5; --surface: #FFFFFF; --surface-2: #F1EAEE; --surface-3: #E8DDE3;
    --ink: #3D3D3D; --muted: #6E686B; --faint: #AAAAAA;
    --border: #E5DCE1; --border-soft: #EFE8EC;
    --accent: #6C1D45; --accent-hover: #561637; --accent-soft: #F3E5EC; --moss: #6C1D45;
    --ochre: #D86018; --ochre-soft: #FBE9DD; --ochre-ink: #9A410C; --danger: #B3261E;
    --serif: 'Comfortaa', 'Trebuchet MS', sans-serif; --sans: 'Roboto', system-ui, sans-serif;
    --r-lg: 16px; --r-md: 12px; --r-sm: 8px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 20px 64px; }

  header.top { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; }
  .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--moss); margin: 0 0 6px; }
  h1 { font: 600 clamp(26px, 3.6vw, 34px)/1.15 var(--serif); color: var(--accent); margin: 0; }
  .lead { color: var(--muted); margin: 8px 0 0; max-width: 52ch; }
  .whoami { display: flex; flex-direction: column; gap: 6px; min-width: 240px; }
  .whoami label { font-size: 13px; color: var(--muted); }

  select, input[type=text], input[type=date], input[type=time], input[type=search], textarea {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
    padding: 10px 12px; width: 100%; min-height: 44px;
  }
  select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .cta { background: var(--accent); color: #fff; border-radius: 24px; padding: 28px 32px; margin-bottom: 28px;
         display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: center; justify-content: space-between; }
  .cta h2 { font: 600 clamp(22px, 2.8vw, 27px)/1.2 var(--serif); margin: 0 0 6px; }

  .cta .btn-big { display: inline-flex; align-items: center; background: var(--ochre); color: #fff; text-decoration: none;
             padding: 16px 26px; font-size: 17px; border-radius: 99px; min-height: 56px; }
  .cta .btn-big:hover { background: #BF5212; }
  .cta .btn-big:focus-visible { outline-color: #fff; }
  .update { margin: -12px 0 20px; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

  .cta .btn-big-secondary:hover { background: rgba(255,255,255,.12); }
  .cta .btn-big-secondary:focus-visible { outline-color: #fff; }
  @media (max-width: 600px) { .cta { padding: 22px 20px; } .cta-actions { width: 100%; } .btn-big, .btn-big-secondary { width: 100%; justify-content: center; } }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab { background: none; border: 0; padding: 12px 16px; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tab[aria-selected=true] { color: var(--ink); border-color: var(--accent); font-weight: 600; }
  .count { display: inline-block; min-width: 22px; padding: 0 7px; margin-left: 6px; border-radius: 99px; background: var(--surface-2); font-size: 12px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .toolbar .search { flex: 1 1 260px; }
  .filter-toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; }
  .filter-toggle .count { margin-left: 0; background: var(--accent); color: #fff; }
  .filter-toggle .chev { transition: transform .15s; font-size: 12px; }
  .filter-toggle[aria-expanded=true] .chev { transform: rotate(180deg); }
  .fswitch { display: none; position: relative; width: 36px; height: 20px; border-radius: 999px; background: var(--border); transition: background .15s; flex-shrink: 0; }
  .fswitch i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .filter-toggle[aria-expanded=true] .fswitch { background: var(--accent); }
  .filter-toggle[aria-expanded=true] .fswitch i { transform: translateX(16px); }
  @media (max-width: 600px) { .filter-toggle .chev { display: none; } .fswitch { display: inline-block; } }
  .btn-text { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 8px 4px; }
  .btn-text:hover { text-decoration: underline; }
  .filters { display: grid; gap: 12px; margin-bottom: 24px; background: var(--surface); border: 1px solid var(--border);
             border-radius: var(--r-lg); padding: 16px 18px; }
  .filter-row { display: flex; gap: 8px; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .filter-label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); width: 78px; flex-shrink: 0; }
  @media (min-width: 960px) {
    /* desktop: the three groups side by side, label above the chips */
    .filters { display: flex; flex-wrap: nowrap; gap: 0; padding: 14px 20px; }
    .filter-row { display: block; padding: 0 18px; border-left: 1px solid var(--border-soft); }
    .chips { gap: 6px; }

  }
  @media (min-width: 1200px) { .chips { flex-wrap: nowrap; } }
  .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 99px; padding: 6px 13px; cursor: pointer; font-size: 13px; }
  .chip[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .card.is-me { border-color: var(--accent); }
  .who { display: flex; gap: 12px; align-items: center; }

  .avatar.photo { width: 56px; height: 56px; object-fit: cover; background: var(--surface-2); }
  .who-text { flex: 1; min-width: 0; }
  .done { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 60px;
          padding: 6px 10px; border-radius: 14px; background: var(--accent); color: #fff; line-height: 1; }
  .done-n { font: 700 24px var(--serif); }
  .done-l { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; opacity: .9; }
  .done.zero { background: var(--surface-2); color: var(--muted); }
  .who h3 { font: 600 18px/1.25 var(--serif); margin: 0; }
  .who p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink); }
  .badge.tz { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .local-note { font-size: 12px; color: var(--muted); font-weight: 400; }
  .badge.match { background: var(--ochre-soft); color: var(--ochre-ink); font-weight: 600; }

  .matrix { display: grid; grid-template-columns: 74px repeat(7, 1fr); gap: 3px; font-size: 11px; color: var(--muted); }
  .matrix span { text-align: center; }
  .matrix .rowlab { text-align: left; }
  .cell { height: 18px; border-radius: 4px; background: var(--border-soft); }
  .cell.on { background: var(--moss); }
  .cell.shared { background: var(--ochre); }

  .notes { font-size: 13px; color: var(--muted); font-style: italic; margin: 0; }
  .card-foot { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: auto; }
  .contact { font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 500; }

  .btn { border: 0; border-radius: var(--r-md); background: var(--accent); color: #fff; padding: 10px 16px; font-weight: 600; cursor: pointer; min-height: 40px; }
  .btn:hover { background: var(--accent-hover); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--accent-soft); }
  .btn-small { padding: 6px 12px; min-height: 34px; font-size: 13px; }
  .btn-danger { color: var(--danger); }

  .day-group { margin-bottom: 24px; }
  .day-group h3 { font: 600 18px var(--serif); color: var(--accent); margin: 0 0 10px; }
  .session { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 8px; }
  .session .time { font: 700 18px var(--serif); font-variant-numeric: tabular-nums; min-width: 60px; }
  .session .pair { flex: 1; min-width: 200px; }
  .session .pair strong { font-weight: 600; }
  .session .meta { font-size: 13px; color: var(--muted); }
  .status { font-size: 12px; padding: 3px 9px; border-radius: 99px; font-weight: 600; }
  .status.proposed { background: var(--ochre-soft); color: var(--ochre-ink); }
  .status.confirmed { background: var(--accent-soft); color: var(--accent); }
  .session .actions { display: flex; gap: 6px; }

  /* Loader: a status line plus placeholder cards with a soft shimmer */
  .refreshing { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin: -8px 0 12px; }
  .refreshing .spinner { width: 14px; height: 14px; border-width: 2px; }
  .loader-status { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; padding: 4px 2px; }
  .spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--accent-soft); border-top-color: var(--accent);
             animation: spin .8s linear infinite; flex-shrink: 0; }
  .card.skeleton { pointer-events: none; }
  .sk { background: linear-gradient(90deg, var(--surface-2) 0%, var(--border-soft) 40%, var(--surface-2) 80%);
        background-size: 300% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: 6px; }
  .sk-row { display: flex; gap: 12px; align-items: center; }
  .sk-avatar { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; }
  .sk-line { height: 12px; }
  .sk-grid { height: 92px; border-radius: 8px; }
  .sk-btn { height: 34px; width: 150px; border-radius: var(--r-md); margin-left: auto; }
  /* Busy buttons: spinner + text, the rest of the form locked */
  .btn.is-busy { position: relative; pointer-events: none; opacity: 1; display: inline-flex; align-items: center; gap: 8px; }
  .btn.is-busy::before { content: ''; width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
  form.is-busy .field, form.is-busy .btn-ghost { opacity: .55; pointer-events: none; }
  .busy-note { font-size: 13px; color: var(--muted); margin: 0; display: flex; align-items: center; gap: 8px; min-height: 18px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } .sk { animation: none; } }
  .tabs { overflow-x: auto; scrollbar-width: none; }
  .tab { white-space: nowrap; }
  .fb-intro { color: var(--muted); font-size: 14px; margin: 0 0 18px; max-width: 70ch; }
  .fb-session { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px; margin-bottom: 16px; }
  .fb-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 12px; }
  .fb-head h3 { font: 600 17px var(--serif); color: var(--accent); margin: 0; }
  .fb-head .meta { font-size: 13px; color: var(--muted); }
  .fb-list { display: grid; gap: 12px; margin-bottom: 14px; }
  .fb-empty { font-size: 14px; color: var(--muted); font-style: italic; margin: 0 0 12px; }
  .fb-item { display: flex; gap: 10px; }
  .fb-item .avatar, .fb-item .avatar.photo { width: 34px; height: 34px; font-size: 12px; }
  .fb-bubble { flex: 1; min-width: 0; background: var(--surface-2); border-radius: 4px 14px 14px 14px; padding: 10px 14px; }
  .fb-item.mine .fb-bubble { background: var(--accent-soft); }
  .fb-meta { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .fb-meta strong { color: var(--ink); font-size: 13px; }
  .fb-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.5; }
  .fb-del { margin-left: auto; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0; }
  .fb-del:hover { color: var(--danger); text-decoration: underline; }
  .fb-form { display: grid; gap: 8px; }
  .fb-form textarea { min-height: 70px; resize: vertical; }
  .fb-form .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .fb-form .hint { margin: 0; }
  .kb-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .kb-bar .search { flex: 1 1 220px; }
  .kb-cats { margin-bottom: 18px; }
  .kb-new { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px; margin-bottom: 18px; display: grid; gap: 12px; }
  .kb-new .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .kb-new textarea { min-height: 110px; resize: vertical; }
  .kb-list { display: grid; gap: 14px; }
  .kb-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px 20px; }
  .kb-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .kb-badge { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 3px 9px; }
  .kb-item h3 { font: 600 17px var(--serif); margin: 0 0 6px; color: var(--ink); overflow-wrap: anywhere; }
  .kb-item h3 a { color: var(--accent); }
  .kb-host { font-size: 12px; color: var(--muted); margin: -2px 0 8px; overflow-wrap: anywhere; }
  .kb-text { margin: 0 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.55; }
  .kb-text.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .kb-more { background: none; border: 0; padding: 0; margin: -6px 0 12px; color: var(--accent); cursor: pointer; font-size: 13px; }
  .kb-foot { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .kb-foot .avatar, .kb-foot .avatar.photo { width: 28px; height: 28px; font-size: 11px; }
  .empty, .loading, .error { text-align: center; padding: 48px 20px; color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--r-lg); }
  .error { color: var(--danger); border-style: solid; }

  dialog { border: 0; border-radius: 24px; padding: 0; width: min(460px, calc(100% - 32px)); box-shadow: 0 20px 60px rgba(61,61,61,.25); }
  dialog::backdrop { background: rgba(61,61,61,.4); }
  .dlg { padding: 26px 26px 22px; display: grid; gap: 14px; }
  .dlg h2 { font: 600 22px var(--serif); color: var(--accent); margin: 0; }

  .field label { font-size: 13px; color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .btn-wa { display: inline-flex; align-items: center; text-decoration: none; }
  .wa-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .wa-list:empty { display: none; }
  .status.partial { background: var(--accent-soft); color: var(--accent); }

  .dlg-actions { flex-wrap: wrap; }

  .ph-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .ph-note { margin: 0; padding: 12px 14px; border-radius: var(--r-md); background: var(--accent-soft); color: var(--accent); font-size: 14px; }

  .free-now { background: color-mix(in srgb, var(--ochre) 9%, var(--surface)); border: 1px solid var(--ochre); border-radius: var(--r-lg); padding: 14px 16px 16px; margin-bottom: 22px; }

    .free-person .fp-actions { margin-left: auto; }
  }
  .card.is-free { border-color: var(--ochre); box-shadow: 0 0 0 1px var(--ochre) inset; }
  .free-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #fff; background: var(--ochre);
                padding: 3px 10px; border-radius: 99px; }
  .free-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .free-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface-2); }
  .free-row.on { background: var(--ochre-soft); }
  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; font-size: 14px; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .track { width: 42px; height: 24px; border-radius: 99px; background: var(--faint); position: relative; transition: background .15s; flex-shrink: 0; }
  .switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + .track { background: var(--ochre); }
  .switch input:checked + .track::after { transform: translateX(18px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .free-row.is-saving .track::after { animation: pulse 1s ease-in-out infinite; }
  .free-row.is-saving { opacity: .8; }
  .free-row select { width: auto; min-height: 34px; padding: 4px 8px; font-size: 13px; }
  .free-row .until { font-size: 12px; color: var(--ochre-ink); margin-left: auto; }
  .chip-now { display: inline-flex; align-items: center; gap: 6px; }
  .chip-now .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ochre); }
  @media (prefers-reduced-motion: reduce) { .free-badge .dot { animation: none; } .switch .track, .switch .track::after { transition: none; } }
  .online-chip b { font-weight: 700; }
  .online-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink);
                 background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 5px 11px; cursor: pointer; position: relative; }
  .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #2E9E5B; box-shadow: 0 0 0 3px rgba(46,158,91,.18); flex-shrink: 0; }
  .online-list { position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; min-width: 200px; max-width: 280px; text-align: left;
                 background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px;
                 box-shadow: 0 10px 30px rgba(61,61,61,.15); font-weight: 400; display: grid; gap: 6px; }
  .online-list .row { display: flex; align-items: center; gap: 8px; }
  .av-wrap { position: relative; display: inline-flex; flex-shrink: 0; }
  .av-wrap .online-dot { position: absolute; right: 0; bottom: 1px; width: 12px; height: 12px; border: 2px solid var(--surface); box-shadow: none; }
  .account { display: flex; align-items: center; gap: 10px; justify-content: flex-end; min-height: 44px; }
  .account .who-mini { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .account .avatar, .account .avatar.photo { width: 36px; height: 36px; font-size: 13px; }
  .account .btn-text { font-size: 13px; color: var(--muted); }
  .g-btn { display: flex; justify-content: center; min-height: 44px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .link-form { display: grid; gap: 10px; }
  .add-photo { font-size: 12px; color: var(--ochre-ink); background: var(--ochre-soft); border: 0; border-radius: 99px; padding: 3px 9px; cursor: pointer; font-weight: 600; }
  .avatar-btn { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 50%; }
  .form-error { color: var(--danger); font-size: 13px; margin: 0; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }
  .obs-opt { gap: 6px; }
  .obs-opt[hidden] { display: none; }
  .obs-opt .switch { font-weight: 500; }
  .obs-note { white-space: nowrap; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: var(--r-sm); font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: -8px 0 18px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }

  .side { display: flex; flex-direction: column; gap: 12px; align-items: stretch; min-width: 240px; }
  .lang { display: inline-flex; align-self: flex-end; border: 1px solid var(--border); border-radius: 99px; padding: 3px; background: var(--surface); }
  .lang button { border: 0; background: none; border-radius: 99px; padding: 5px 12px; font-size: 12px; font-weight: 600; letter-spacing: .06em; cursor: pointer; color: var(--muted); }
  .lang button[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); }
  @media (max-width: 600px) {
    header.top { display: flex; flex-direction: column; align-items: stretch; gap: 14px; margin-bottom: 20px; }
    header.top .side { order: -1; width: 100%; min-width: 0; flex-direction: row; align-items: center; justify-content: space-between;
                       gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .side .lang { order: 2; align-self: center; flex-shrink: 0; }
    .side .account { order: 1; justify-content: flex-start; flex-wrap: nowrap; min-width: 0; gap: 8px; min-height: 40px; }
    .account .who-mini { min-width: 0; gap: 8px; font-size: 15px; }
    .account .who-mini { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .account .avatar, .account .avatar.photo { width: 32px; height: 32px; }
    .online-chip { padding: 4px 9px; font-size: 12px; }
    .online-word { display: none; }
    h1 { font-size: 26px; }
    .lead { font-size: 14.5px; }
    .update { margin: -6px 0 16px; justify-content: space-between; }
    .side { width: 100%; }
    .wrap { padding: 20px 16px 48px; }
    .filter-row { display: block; }
    .filter-label { display: block; width: auto; margin-bottom: 8px; }
    .two { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="wrap">
  <header class="top">

  <aside class="cta" id="cta" hidden>

  </aside>
  <p class="update" id="update" hidden><span data-i18n="updateText"></span>

  <p class="refreshing" id="refreshing" role="status" hidden><span class="spinner" aria-hidden="true"></span><span data-i18n="refreshing"></span></p>

    <button class="tab" role="tab" id="tab-people" aria-selected="true" aria-controls="panel-people"><span data-i18n="tabPeople"></span><span class="count" id="c-people">0</span></button>
    <button class="tab" role="tab" id="tab-sessions" aria-selected="false" aria-controls="panel-sessions"><span data-i18n="tabSessions"></span><span class="count" id="c-sessions">0</span></button>
    <button class="tab" role="tab" id="tab-feedback" aria-selected="false" aria-controls="panel-feedback"><span data-i18n="tabFeedback"></span><span class="count" id="c-feedback" hidden></span></button>
    <button class="tab" role="tab" id="tab-kb" hidden aria-selected="false" aria-controls="panel-kb"><span data-i18n="tabKb"></span><span class="count" id="c-kb" hidden></span></button>
  </div>

  <section id="panel-people" role="tabpanel" aria-labelledby="tab-people">

      <input type="search" class="search" id="q" data-i18n-ph="search">
      <button type="button" class="btn btn-ghost filter-toggle" id="f-toggle" aria-expanded="false" aria-controls="filters">

/* Values as they arrive from the form (English), used for matching */
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const SLOTS = ['Morning','Lunchtime','Afternoon','Evening'];
const FORMATS = ['Online','In person'];
const TONES = ['#F3E5EC','#FBE9DD','#EDE3F0','#F6E7E0','#EAE6EC','#F8EFE6'];

const state = { people: [], bookings: [], today: '', me: '', q: '', format: null, day: null, slot: null, lang: 'it' };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = (s) => String(s || '').trim().toLowerCase();
const T = () => STR[state.lang];

try {
  state.session = JSON.parse(localStorage.getItem('se-session') || 'null');
  if (!state.session) {   // devices that already opened a personal link before this version
    const old = JSON.parse(localStorage.getItem('se-key') || 'null');
    if (old && old.key) state.session = old;
  }
  state.me = state.session ? state.session.name : '';
  localStorage.removeItem('se-me');
  state.lang = localStorage.getItem('se-lang') || 'it';   // Italian by default; the choice made with IT · EN is remembered
} catch (e) { state.lang = 'it'; }
if (!STR[state.lang]) state.lang = 'it';

/* Translate a value coming from the form ("Triad (practitioner, client, observer)" → "Triade …") */
function tv(v) {
  const map = T().values;
  const k = Object.keys(map).find(x => String(v).toLowerCase().startsWith(x.toLowerCase()));
  return k ? map[k] : v;
}
const dayIdx = (v) => DAYS.findIndex(d => String(v).toLowerCase().startsWith(d.toLowerCase().slice(0,3)));
const slotIdx = (v) => SLOTS.findIndex(s => String(v).toLowerCase().startsWith(s.toLowerCase()));
const dayLabel = (v) => { const i = dayIdx(v); return i < 0 ? v : T().days[i]; };
const slotLabel = (v) => { const i = slotIdx(v); return i < 0 ? v : T().slots[i]; };

function errMsg(err) {
  const raw = String(err && err.message || err);
  if (/ERR_NOT_YOU/.test(raw) && state.session) setTimeout(() => { setSession(null); openLogin(T().err.ERR_NOT_YOU); }, 0);
  console.error(raw);   // full technical detail stays in the console
  const m = raw.match(/ERR_[A-Z_]+(\|[^\n]*)?/);
  if (!m) return /permission|authoriz|autorizz/i.test(raw) ? T().err.ERR_SETUP
               : /fetch|network|Failed|HTTP/i.test(raw) ? T().err.ERR_NETWORK : T().err.ERR_GENERIC;
  const [code, ...args] = m[0].split('|');
  const e = T().err[code];
  return typeof e === 'function' ? e(...args) : (e || code);
}

/* ---------- Server calls ----------
   The page runs on GitHub Pages and talks to the Apps Script web app.
   Opened as a local file it uses the sample data at the bottom. */
const API_URL = 'https://script.google.com/macros/s/AKfycbxN96Sd3NW8w0RULZsR3RRw56doqBrkkkGdk6a8t5rdfAJHzy3VHzrJc7Mq2oxjXHO1/exec';
const FORM_URL = 'https://forms.gle/Je4gaWUF94cij7Vb8';   // Google Form for availability
const USE_SAMPLE = location.protocol === 'file:' || /[?&]demo\b/.test(location.search);

async function call(fn, ...args) {
  if (USE_SAMPLE) { if (fn !== 'getData' && fn !== 'getNow') await new Promise(r => setTimeout(r, 2500)); return demo(fn, ...args); }
  const res = fn === 'getData' && !args[0]
    ? await fetch(API_URL + '?fn=getData', { cache: 'no-store' })
    : await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                             body: JSON.stringify({ fn, args }) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const out = await res.json();
  if (out.error) throw new Error(out.error);
  return out.data;
}

/* ---------- Helpers ---------- */
const hasDay = (p, d) => p.days.some(x => dayIdx(x) === DAYS.indexOf(d));
const hasSlot = (p, s) => p.slots.some(x => slotIdx(x) === SLOTS.indexOf(s));
const isOnline = (p) => /online|both/i.test(p.format);
const isInPerson = (p) => /person|both/i.test(p.format);
const initials = (n) => n.split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join('');
const first = (n) => String(n).split(/\s+/)[0];
const tone = (n) => TONES[[...n].reduce((a,c) => a + c.charCodeAt(0), 0) % TONES.length];
const meP = () => state.people.find(p => key(p.name) === key(state.me));
/* ---------- Time zones: sessions are stored in Italian time, everyone sees their own ---------- */
const REF_TZ = 'Europe/Rome';
const MY_TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || REF_TZ; } catch (e) { return REF_TZ; } })();
function partsIn(tz, d) {
  const o = {};
  new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(d).forEach(x => { o[x.type] = x.value; });
  return { date: `${o.year}-${o.month}-${o.day}`, time: `${o.hour}:${o.minute}` };
}
function offsetMin(tz, d) {   // minutes ahead of UTC in tz at moment d
  const p = partsIn(tz, d), [y, m, dd] = p.date.split('-').map(Number), [h, mi] = p.time.split(':').map(Number);
  return Math.round((Date.UTC(y, m - 1, dd, h, mi) - Math.floor(d.getTime() / 60000) * 60000) / 60000);
}
function romeInstant(date, time) {   // "2026-11-04", "19:00" in Italy → the moment
  const [y, m, d] = date.split('-').map(Number), [h, mi] = time.split(':').map(Number);
  const guess = Date.UTC(y, m - 1, d, h, mi);
  return new Date(guess - offsetMin(REF_TZ, new Date(guess - offsetMin(REF_TZ, new Date(guess)) * 60000)) * 60000);
}
const localOf = (b) => partsIn(MY_TZ, romeInstant(b.date, b.time));
function localInputToRome(date, time) {   // what the person typed (their own time) → Italian date and time
  const [y, m, d] = date.split('-').map(Number), [h, mi] = time.split(':').map(Number);
  return partsIn(REF_TZ, new Date(y, m - 1, d, h, mi));
}
const zoneDiffH = (tz) => (offsetMin(tz, new Date()) - offsetMin(REF_TZ, new Date())) / 60;
const iAmAbroad = () => zoneDiffH(MY_TZ) !== 0;
const cityOf = (tz) => tz.split('/').pop().replace(/_/g, ' ');
const signedH = (h) => (h > 0 ? '+' : h < 0 ? '−' : '±') + Math.abs(h).toString().replace('.5', ',5') + ' h';

/* "19:00" → "19:00 (sera)" / "7:00 pm (evening)": never a doubt between morning and evening */
function timeLabel(hhmm) {
  const [h, mi] = String(hhmm).split(':').map(Number);
  if (isNaN(h)) return String(hhmm);
  const part = h >= 5 && h < 12 ? 0 : h >= 12 && h < 14 ? 1 : h >= 14 && h < 18 ? 2 : h >= 18 && h < 23 ? 3 : 4;   // same bands as the form
  const mm = String(mi || 0).padStart(2, '0');
  if (state.lang === 'en') return `${h % 12 || 12}:${mm} ${h < 12 ? 'am' : 'pm'} (${['morning', 'lunchtime', 'afternoon', 'evening', 'night'][part]})`;
  return `${h}:${mm} (${['mattina', 'pranzo', 'pomeriggio', 'sera', 'notte'][part]})`;
}
const partOfDay = (hhmm) => { const m = timeLabel(hhmm).match(/\(([^)]+)\)/); return m ? m[1] : ''; };

const isConnected = (name) => !!(state.online && state.online.includes(name));
const freeUntil = (p) => p && p.freeUntil && new Date(p.freeUntil).getTime() > Date.now() ? new Date(p.freeUntil) : null;
const hhmm = (d) => d.toLocaleTimeString(T().locale, { hour: '2-digit', minute: '2-digit' });

function shared(p, m) {
  if (!m || key(m.name) === key(p.name)) return null;
  const days = DAYS.filter(d => hasDay(p,d) && hasDay(m,d));
  const slots = SLOTS.filter(s => hasSlot(p,s) && hasSlot(m,s));
  return { days, slots, score: days.length * slots.length };
}

function waLink(phone) {
  let d = String(phone || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);
  if (d.length === 10 && d.startsWith('3')) d = '39' + d;
  return 'https://wa.me/' + d;
}

function fmtDate(iso, opts) {
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString(T().locale, opts || { weekday: 'long', day: 'numeric', month: 'long' });
}

const invitees = (b) => [b.with].concat(b.third ? [b.third] : []);
const participants = (b) => [b.by].concat(invitees(b));
const person = (n) => state.people.find(x => key(x.name) === key(n));
function joinNames(list) {
  return list.length < 2 ? list.join('') : list.slice(0, -1).join(', ') + ' ' + T().and + ' ' + list[list.length - 1];
}
/* Message for one invitee (to), or a generic one for the group when to is empty */
function inviteText(b, to) {
  const when = state.lang === 'it' ? fmtDate(b.date) : 'on ' + fmtDate(b.date);
  const others = invitees(b).filter(n => !to || key(n) !== key(to)).map(first);
  const inv = invitees(b);
  const abroad = iAmAbroad() || participants(b).some(n => { const p = person(n); return p && p.tz && zoneDiffH(p.tz) !== 0; });
  const rp = to && person(to);
  const extra = rp && rp.tz && zoneDiffH(rp.tz) !== 0 ? ', ' + T().yourTime(timeLabel(partsIn(rp.tz, romeInstant(b.date, b.time)).time)) : '';
  return T().invite({ to: to ? first(to) : joinNames(inv.map(first)), plural: !to && inv.length > 1, others: to ? joinNames(others) : '', when,
    time: timeLabel(b.time) + (abroad ? ' · ' + T().italyTime + extra : ''),
    fmt: tv(b.format).toLowerCase(), note: b.note, url: state.appUrl || '', from: first(b.by) });
}
function waInvite(b, to) {
  const p = person(to);
  const base = p ? waLink(p.phone) : '';
  return base ? base + '?text=' + encodeURIComponent(inviteText(b, to)) : '';
}
const asList = (x) => Array.isArray(x) ? x : (x ? [x] : []);

/* Turns a button into a loader until done() is called; optional status line with messages that change over time */
function busy(btn, label, noteEl, steps) {
  const before = btn.innerHTML, width = btn.offsetWidth;
  btn.classList.add('is-busy'); btn.disabled = true; btn.setAttribute('aria-busy', 'true');
  btn.style.minWidth = width + 'px';
  btn.textContent = label;
  const form = btn.closest('form'); if (form) form.classList.add('is-busy');
  const timers = [];
  if (noteEl && steps) steps.forEach(([ms, text]) => timers.push(setTimeout(() => { noteEl.textContent = text; }, ms)));
  return function done() {
    timers.forEach(clearTimeout);
    if (noteEl) noteEl.textContent = '';
    btn.classList.remove('is-busy'); btn.disabled = false; btn.removeAttribute('aria-busy');
    btn.style.minWidth = ''; btn.innerHTML = before;
    if (form) form.classList.remove('is-busy');
  };
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3500);
}

/* ---------- Static texts and filters ---------- */
function applyTexts() {
  const t = T();
  document.documentElement.lang = state.lang;
  document.title = t.title;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = t[el.dataset.i18nPh]; el.setAttribute('aria-label', t[el.dataset.i18nPh]);
  });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
  $('b-format').innerHTML = FORMATS.map(f => `<option value="${f}">${esc(tv(f))}</option>`).join('');
  buildFilters();
}

function buildFilters() {
  const t = T();
  buildChips('f-format', t.fFormat, FORMATS.map(f => [f, tv(f)]), 'format');
  buildChips('f-day', t.fDay, DAYS.map((d, i) => [d, t.days[i]]), 'day');
  buildChips('f-slot', t.fTime, SLOTS.map((s, i) => [s, t.slots[i]]), 'slot');
  updateFilterUI();
}

/* Show / hide the filter panel; open by default on desktop, closed on phones; the choice is remembered */
const isPhone = () => window.matchMedia('(max-width: 600px)').matches;
function setFiltersOpen(open) {
  $('filters').hidden = !open;
  $('f-toggle').setAttribute('aria-expanded', String(open));
  if (!isPhone()) try { localStorage.setItem('se-filters', open ? '1' : '0'); } catch (e) {}
}
function updateFilterUI() {
  const n = ['format', 'day', 'slot'].filter(k => state[k]).length;
  $('f-count').hidden = !n; $('f-count').textContent = n;
  $('f-reset').hidden = !n && !state.q;
}

function buildChips(id, label, items, prop) {
  const row = $(id);
  row.innerHTML = `<span class="filter-label">${esc(label)}</span><div class="chips"></div>`;
  const box = row.querySelector('.chips');
  items.forEach(([value, text]) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = text;
    b.setAttribute('aria-pressed', String(state[prop] === value));
    b.onclick = () => {
      state[prop] = state[prop] === value ? null : value;
      [...row.querySelectorAll('.chip')].forEach(c => c.setAttribute('aria-pressed', String(c === b && state[prop] === value)));
      updateFilterUI();
      renderPeople();
    };
    box.appendChild(b);
  });
}

/* Highlighted strip on top: who is free right now (signed-in students only) */
function renderFreeNow() {
  const box = $('free-now'), t = T();
  const free = myKey() ? state.people.filter(p => freeUntil(p)).sort((a, b) => freeUntil(b) - freeUntil(a)) : [];
  const me = meP(), meFree = me && freeUntil(me);
  const others = free.filter(p => !me || p.name !== me.name);
  box.hidden = !others.length;
  if (!others.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="free-now-head"><h2 id="free-now-h"><span class="dot" aria-hidden="true"></span>${esc(t.freeNowTitle(others.length))}</h2>
      ${me && !meFree ? `<button type="button" class="btn btn-ghost btn-small" data-free-me="1">${esc(t.freeMeToo)}</button>` : ''}</div>
    <div class="free-now-list">${others.map(p => {
      const wa = waLink(p.phone);
      return `<div class="free-person">${avatar(p.name)}
        <div class="fp-text"><strong>${esc(first(p.name))}</strong><span class="fp-until">${esc(t.freeShort(hhmm(freeUntil(p))))}</span></div>
        <div class="fp-actions">${wa ? `<a class="fp-wa" href="${wa}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
          <button class="btn btn-small" data-book="${esc(p.name)}" data-now="1">${esc(t.proposeNow)}</button></div></div>`;
    }).join('')}</div>`;
}
document.addEventListener('click', (e) => { if (e.target.closest('[data-free-me]')) setFree(true); });

function renderPeople() {
  renderFreeNow();
  const t = T();
  const m = meP();
  const q = key(state.q);
  let list = state.people.filter(p => {
    if (q && !key(p.name + ' ' + p.region).includes(q)) return false;
    if (state.format === 'Online' && !isOnline(p)) return false;
    if (state.format === 'In person' && !isInPerson(p)) return false;
    if (state.day && !hasDay(p, state.day)) return false;
    if (state.slot && !hasSlot(p, state.slot)) return false;
    if (state.nowOnly && !freeUntil(p)) return false;
    return true;
  });
  // most sessions done first; ties: free right now, then best match with me, then name
  list = list.map(p => ({ p, s: m ? shared(p, m) : null }))
    .sort((a, b) => (b.p.done || 0) - (a.p.done || 0)
      || (freeUntil(b.p) ? 1 : 0) - (freeUntil(a.p) ? 1 : 0)
      || (b.s?.score || 0) - (a.s?.score || 0)
      || a.p.name.localeCompare(b.p.name))
    .map(x => x.p);

  $('c-people').textContent = state.people.length;
  const box = $('people');
  if (!state.people.length) { box.innerHTML = `<div class="empty">${esc(t.noPeople)}</div>`; return; }
  updateNowChip();
  if (!list.length) { box.innerHTML = `<div class="empty">${esc(state.nowOnly ? t.noFreeNow : t.noMatch)}</div>`; return; }

  box.innerHTML = list.map(p => {
    const s = shared(p, m);
    const isMe = m && key(m.name) === key(p.name);
    const matrix = '<span></span>' + t.daysMini.map(d => `<span>${d}</span>`).join('') +
      SLOTS.map((sl, si) => `<span class="rowlab">${t.slots[si]}</span>` + DAYS.map((d, di) => {
        const on = hasDay(p,d) && hasSlot(p,sl);
        const both = on && s && hasDay(m,d) && hasSlot(m,sl);
        return `<span class="cell ${both ? 'shared' : on ? 'on' : ''}" title="${t.daysLong[di]} · ${t.slots[si]}${on ? ' · ' + t.available : ''}"></span>`;
      }).join('')).join('');
    const badges = [p.format, p.setup, p.frequency, ...(p.languages || [])].filter(Boolean)
      .map(b => `<span class="badge">${esc(tv(b))}</span>`).join('');
    const match = s && s.score ? `<span class="badge match">${esc(t.shared(s.days.length, s.slots.map(slotLabel).join(', ')))}</span>` : '';
    const wa = waLink(p.phone);
    const aria = t.availableAria(p.days.map(dayLabel).join(', '), p.slots.map(slotLabel).join(', '));
    const fu = freeUntil(p);
    const freeRow = isMe ? `<div class="free-row ${fu ? 'on' : ''}">
        <label class="switch"><input type="checkbox" data-free ${fu ? 'checked' : ''}><span class="track" aria-hidden="true"></span>${esc(t.freeNow)}</label>
        <select data-free-mins aria-label="${esc(t.freeNow)}">${[30, 60, 120, 180].map(m => `<option value="${m}" ${m === (state.freeMins || 60) ? 'selected' : ''}>${esc(t.freeFor[m])}</option>`).join('')}</select>
        ${fu ? `<span class="until">${esc(t.freeShort(hhmm(fu)))}</span>` : ''}
      </div>` : '';
    return `<article class="card ${isMe ? 'is-me' : ''} ${fu ? 'is-free' : ''}">
      <div class="who">
        ${(() => {
          const av = p.photo
            ? `<img class="avatar photo" src="${esc(p.photo)}" alt="" loading="lazy">`
            : `<div class="avatar" style="background:${tone(p.name)}" aria-hidden="true">${esc(initials(p.name))}</div>`;
          const dot = isConnected(p.name) ? `<span class="online-dot" title="${esc(t.onlineNow)}" aria-label="${esc(t.onlineNow)}"></span>` : '';
          const wrapped = `<span class="av-wrap">${av}${dot}</span>`;
          return isMe ? `<button type="button" class="avatar-btn" data-photo="1" aria-label="${esc(t.phTitle)}">${wrapped}</button>` : wrapped;
        })()}
        <div class="who-text"><h3>${esc(p.name)}${isMe ? ` <span class="badge">${esc(t.you)}</span>` : ''}${isMe && !p.photo ? ` <button type="button" class="add-photo" data-photo="1">${esc(t.addPhoto)}</button>` : ''}</h3><p>${esc(p.region || '—')}</p></div>
        <div class="done ${p.done ? '' : 'zero'}" title="${esc(t.doneTitle2(p.done || 0))}" aria-label="${esc(t.doneTitle2(p.done || 0))}">
          <span class="done-n">${p.done || 0}</span><span class="done-l">${esc(t.doneLabel(p.done || 0))}</span>
        </div>
      </div>
      ${fu && !isMe ? `<div><span class="free-badge"><span class="dot" aria-hidden="true"></span>${esc(t.freeUntil(hhmm(fu)))}</span></div>` : ''}
      ${freeRow}
      <div class="badges">${match}${p.tz && zoneDiffH(p.tz) !== 0 ? `<span class="badge tz">${esc(t.tzBadge(cityOf(p.tz), signedH(zoneDiffH(p.tz))))}</span>` : ''}${badges}</div>
      <div class="matrix" role="img" aria-label="${esc(aria)}">${matrix}</div>
      ${p.notes ? `<p class="notes">${esc(p.notes)}</p>` : ''}
      <div class="card-foot">
        ${wa ? `<a class="contact" href="${wa}" target="_blank" rel="noopener">WhatsApp →</a>` : '<span></span>'}
        ${isMe ? '' : !myKey() ? `<button class="btn btn-ghost btn-small" data-login="1">${esc(t.signInToPropose)}</button>`
               : fu ? `<button class="btn btn-small" data-book="${esc(p.name)}" data-now="1">${esc(t.proposeNow)}</button>`
                         : `<button class="btn btn-small" data-book="${esc(p.name)}">${esc(t.proposeSession)}</button>`}
      </div>
    </article>`;
  }).join('');
}

const SESSION_MIN = 60;   // same as SESSION_MINUTES in the engine
function renderSessions() {
  const t = T();
  // drop unconfirmed sessions whose start time passed while the page was open
  state.bookings = state.bookings.filter(b => b.status === 'confirmed'
    ? romeInstant(b.date, b.time).getTime() + SESSION_MIN * 60000 > Date.now()
    : romeInstant(b.date, b.time).getTime() > Date.now());
  $('c-sessions').textContent = state.bookings.length;
  const box = $('sessions');
  if (!state.bookings.length) { box.innerHTML = `<div class="empty">${esc(t.noSessions)}</div>`; return; }
  const me = key(state.me);
  const groups = {};
  state.bookings.forEach(b => { const d = localOf(b).date; (groups[d] = groups[d] || []).push(b); });
  box.innerHTML = Object.keys(groups).map(d => {
    const title = fmtDate(d);
    return `<div class="day-group"><h3>${esc(title.charAt(0).toUpperCase() + title.slice(1))}</h3>` +
    groups[d].map(b => {
      const inv = invitees(b);
      const done = b.confirmedBy || [];
      const mine = me && participants(b).some(n => key(n) === me);
      // in a triad the session is on with two people: whoever has not answered can still join (or decline without cancelling it)
      const canConfirm = me && (b.status === 'proposed' || b.status === 'confirmed') && inv.some(n => key(n) === me) && !done.some(n => key(n) === me);
      const pendingNames = inv.filter(n => !done.some(x => key(x) === key(n)));
      const reminders = me && key(b.by) === me && (b.status === 'proposed' || b.status === 'confirmed')
        ? inv.filter(n => !done.includes(n)).map(n => [n, waInvite(b, n)]).filter(x => x[1]) : [];
      const statusLabel = b.status === 'confirmed' ? t.confirmed : done.length ? t.partial(done.length, inv.length) : t.proposed;
      const statusClass = b.status === 'confirmed' ? 'confirmed' : done.length ? 'partial' : 'proposed';
      // observer: a pair can open the session to one observer, who joins with one click once it is confirmed
      const iObserve = me && b.observer && key(b.observer) === me;
      const started = romeInstant(b.date, b.time).getTime() <= Date.now();
      const canObserve = b.observerOk && !b.observer && b.status === 'confirmed' && !mine && !started;
      const obsNote = b.observerOk ? (b.observer ? t.observerIs(iObserve ? t.you : first(b.observer)) : t.observerOpen) : '';
      return `<div class="session">
        <span class="time">${esc(localOf(b).time)}<br><span class="local-note">${esc(partOfDay(localOf(b).time))}</span>${iAmAbroad() ? `<br><span class="local-note">${esc(t.inItaly(timeLabel(b.time)))}</span>` : ''}</span>
        <div class="pair"><strong>${esc(b.by)}</strong> ${esc(t.withWord)} ${inv.map(n => `<strong>${esc(n)}</strong>`).join(' ' + esc(t.and) + ' ')}
          <div class="meta">${esc(tv(b.format))}${b.note ? ' · ' + esc(b.note) : ''}${b.status === 'confirmed' && mine && b.format !== 'In person' ? ' · ' + esc(t.meetByEmail) : ''}${b.status === 'confirmed' && pendingNames.length ? ' · ' + esc(canConfirm ? t.youCanJoin : t.notYet(joinNames(pendingNames.map(first)))) : ''}${obsNote ? ` · <span class="obs-note">👁 ${esc(obsNote)}</span>` : ''}${iObserve && b.format !== 'In person' ? ' · ' + esc(t.meetByCalendar) : ''}</div></div>
        <span class="status ${statusClass}">${esc(statusLabel)}</span>
        ${mine ? `<div class="actions">
          ${canConfirm ? `<button class="btn btn-small" data-confirm="${esc(b.id)}">${esc(t.confirm)}</button>` : ''}
          ${reminders.map(([n, wa]) => `<a class="btn btn-ghost btn-small btn-wa" href="${esc(wa)}" target="_blank" rel="noopener">${esc(inv.length > 1 ? t.waTo(first(n)) : t.remindWa)}</a>`).join('')}
          <button class="btn btn-ghost btn-small btn-danger" data-cancel="${esc(b.id)}" ${canConfirm ? `data-decline="${inv.length > 1 ? 'keep' : '1'}"` : ''}>${esc(canConfirm ? t.decline : t.cancelSession)}</button></div>` : ''}
        ${canObserve ? `<div class="actions"><button class="btn btn-small btn-observe" data-observe="${esc(b.id)}">👁 ${esc(t.joinObserver)}</button></div>` : ''}
        ${iObserve && !started ? `<div class="actions"><button class="btn btn-ghost btn-small" data-unobserve="${esc(b.id)}">${esc(t.leaveObserver)}</button></div>` : ''}
      </div>`;
    }).join('') + '</div>';
  }).join('');
}

/* ---------- Booking dialog ---------- */
function openBooking(withName, now) {
  if (!myKey()) return openLogin(T().needLogin);
  $('b-by').value = state.me;
  $('b-with').innerHTML = state.people.filter(p => key(p.name) !== key(state.me))
    .map(p => `<option ${key(p.name)===key(withName)?'selected':''}>${esc(p.name)}</option>`).join('');
  fillThird(''); $('b-obs').checked = false; syncObs();
  $('b-date').min = state.today; $('b-date').value = '';
  $('b-time').value = ''; $('b-note').value = ''; $('b-error').textContent = '';
  if (now) {   // "Propose now": today, at the next quarter of an hour
    const d = new Date(Date.now() + 10 * 60000); d.setMinutes(Math.ceil(d.getMinutes() / 15) * 15, 0, 0);
    const pad = (n) => String(n).padStart(2, '0');
    $('b-date').value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    $('b-time').value = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  $('book').hidden = false; $('done').hidden = true;
  updateHint();

function updateHint() {
  const t = T();
  const a = person($('b-by').value);
  const b = person($('b-with').value);
  const c = person($('b-third').value);
  if (!b) { $('b-hint').textContent = ''; return; }
  if (c && a) {
    const days = DAYS.filter(d => [a, b, c].every(p => hasDay(p, d)));
    const slots = SLOTS.filter(sl => [a, b, c].every(p => hasSlot(p, sl)));
    $('b-hint').textContent = days.length && slots.length
      ? t.allFree(days.map(dayLabel).join(', '), slots.map(slotLabel).join(', ')) : t.noCommon;
  } else {
    const s = a ? shared(b, a) : null;
    $('b-hint').textContent = s && s.score
      ? t.bothFree(s.days.map(dayLabel).join(', '), s.slots.map(slotLabel).join(', '))
      : t.usuallyFree(first(b.name), b.days.map(dayLabel).join(', '), b.slots.map(slotLabel).join(', '));
  }
  const away = [b].concat(c ? [c] : []).filter(p => p.tz && zoneDiffH(p.tz) !== 0);
  if (away.length) $('b-hint').textContent += ' ' + away.map(p => t.slotsLocal(first(p.name))).join(' ');

function showDone(b, emailed) {

  params.delete('me'); params.delete('reminders');

/* Square crop, 200 px, JPEG: small enough to store in the sheet and to send to everyone */
function prepareImage(file) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const c = document.createElement('canvas'); c.width = c.height = 200;   // avatars are shown at 36–56 px: 200 is plenty, also on retina
      c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 200, 200);
      URL.revokeObjectURL(url);
      let q = 0.85, out = c.toDataURL('image/jpeg', q);
      while (out.length > 46000 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      out.length > 46000 ? ko(new Error('ERR_PHOTO')) : ok(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('bad')); };
    img.src = url;
  });
}

async function onPick(e) {

}

document.addEventListener('click', async (e) => {

  const row = el.closest('.session');

    }
  } catch (err) { toast(errMsg(err)); }
  finally {
    clearTimeout(slow);
    if (document.body.contains(el)) { done(); if (row) row.querySelectorAll('.actions .btn').forEach(b => { b.disabled = false; }); }

});

/* ---------- Instant start: show the last data seen on this device, then refresh it ----------
   The copy lives only in this browser. "Free now" and presence are kept only for the person signed in when it was saved. */
const CACHE_KEY = 'se-cache-v1';
const CACHE_MAX_AGE = 7 * 864e5;
function saveCache(data) {
  if (USE_SAMPLE || !data || !data.people) return;
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), who: myKey(), data })); } catch (e) { /* storage full or blocked */ }
}
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (!c || !c.data || Date.now() - c.at > CACHE_MAX_AGE) return null;
    const data = c.data;
    if (c.who !== myKey()) {   // saved for someone else, or before signing out: drop the members-only parts
      data.people.forEach(p => { delete p.freeUntil; });
      data.online = [];
    }
    return data;
  } catch (e) { return null; }
}
function setRefreshing(on) {
  $('refreshing').hidden = !on;
}

applyTexts();
const cached = USE_SAMPLE ? null : loadCache();
if (cached) { apply(cached); setRefreshing(true); } else renderLoading();
const slowTimer = cached ? 0 : setTimeout(() => { const el = $('loading-text'); if (el) el.textContent = T().loadingSlow; }, 4000);
recognise();
call('getData', myKey()).then(data => {
  apply(data); saveCache(data);
  state.me ? maybeAskPhoto() : maybeAskLogin();
}).catch(err => {
  if (cached) { toast(T().offlineCopy); return; }   // keep showing the saved copy
  $('people').innerHTML = `<div class="error">${esc(T().loadError)} ${esc(errMsg(err))}</div>`;
  $('sessions').innerHTML = '';
}).finally(() => { clearTimeout(slowTimer); setRefreshing(false); $('people').removeAttribute('aria-busy'); });

  db.bookings.sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
  return JSON.parse(JSON.stringify(db));
}
